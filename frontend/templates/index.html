
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pi Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="page-container">
        <section id="dashboard-page" class="page active">
            <header class="topbar">
                <div>
                    <h1>Good morning</h1>
                    <p>Raspberry Pi Dashboard</p>
                </div>

                <div class="clock" id="clock">09:41</div>
            </header>

            <section class="grid">

                <article class="card weather">
                    <h2>Weather</h2>
                    <img id="weather-icon" src="" alt="Weather icon">
                    <div id="temperature" class="temperature">--°C</div>
                    <div id="feels-like" class="feels-like">
                        Feels like --°C
                    </div>
                    <div id="description" class="description">
                        Loading...
                    </div>
                    <div id="location" class="location">
                        Loading...
                    </div>
                    <div id="rain" class="rain">--mm</div>
                    <div id="wind-speed" class="wind-speed">
                        -- m/s
                    </div>
                    <div id="humidity" class="humidity">
                        --%
                    </div>
                </article>


                <article class="card calendar">
                    <h2>Upcoming events</h2>
                    <ul id="calendar-items"></ul>
                </article>

            </section>
            <footer>
                <span>Raspberry Pi</span>
                <span>Swipe to navigate</span>
            </footer>
        </section>
        <section id="calendar-page" class="page">
            <header class="calendar-header">
                <div>
                    <h1>Calendar</h1>
                    <p id="calendar-date" aria-live="polite"></p>
                </div>
                <label id="calendar-selector" class="calendar-selector" for="calendar-select">
                    Calendar
                    <select id="calendar-select" aria-label="Choose a calendar"></select>
                </label>
            </header>

            <section class="calendar-layout" aria-label="Calendar and selected day events">
                <article class="card calendar-month-card">
                    <div class="calendar-controls">
                        <button id="calendar-previous" type="button" aria-label="Previous month">‹</button>
                        <h2 id="calendar-month-heading" aria-live="polite">Loading calendar…</h2>
                        <button id="calendar-next" type="button" aria-label="Next month">›</button>
                    </div>
                    <div class="calendar-weekdays" aria-hidden="true">
                        <span>Sun</span>
                        <span>Mon</span>
                        <span>Tue</span>
                        <span>Wed</span>
                        <span>Thu</span>
                        <span>Fri</span>
                        <span>Sat</span>
                    </div>
                    <div id="calendar-grid" class="calendar-grid" aria-label="Days of the month"></div>
                    <p id="calendar-status" class="calendar-status" role="status"></p>
                </article>

                <article class="card calendar-events-panel" aria-labelledby="selected-day-heading">
                    <h2 id="selected-day-heading">Events</h2>
                    <ul id="selected-day-events" class="selected-day-events"></ul>
                </article>
            </section>

            <footer>← Swipe right for dashboard</footer>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
    <script src="{{ url_for('static', filename='js/swipe.js') }}"></script>
</body>
</html>
