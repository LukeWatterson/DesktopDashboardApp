
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pi Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="page-container">
        <section id="dashboard-page" class="page active">
            <header class="topbar">
                <div>
                    <h1>Good morning</h1>
                    <p>Raspberry Pi Dashboard</p>
                </div>

                <div class="clock" id="clock">09:41</div>
            </header>

            <section class="grid">

                <article class="card weather">
                    <h2>Weather</h2>
                    <img id="weather-icon" src="" alt="Weather icon">
                    <div id="temperature" class="temperature">--°C</div>
                    <div id="feels-like" class="feels-like">
                        Feels like --°C
                    </div>
                    <div id="description" class="description">
                        Loading...
                    </div>
                    <div id="location" class="location">
                        Loading...
                    </div>
                    <div id="rain" class="rain">--mm</div>
                    <div id="wind-speed" class="wind-speed">
                        -- m/s
                    </div>
                    <div id="humidity" class="humidity">
                        --%
                    </div>
                </article>


                <article class="card calendar">
                    <h2>Upcoming events</h2>
                    <ul id="calendar-items"></ul>
                </article>

            </section>
            <footer>
                <span>Raspberry Pi</span>
                <span>Swipe to navigate</span>
            </footer>
        </section>
        <section id="calendar-page" class="page">

            <header>
                <h1>Calendar</h1>
                <div id="calendar-date"></div>
            </header>

            <article class="card">
                <h2>Upcoming events</h2>

                <div class="event">
                    <span>09:00</span>
                    <strong>Morning meeting</strong>
                </div>

                <div class="event">
                    <span>12:30</span>
                    <strong>Lunch</strong>
                </div>

                <div class="event">
                    <span>15:00</span>
                    <strong>Project work</strong>
                </div>

            </article>

            <footer>← Swipe right for dashboard</footer>

        </section>
    </main>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/swipe.js') }}"></script>
</body>
</html>
