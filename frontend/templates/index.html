
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pi Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="dashboard">

        <header class="topbar">
            <div>
                <h1>Good morning</h1>
                <p>Raspberry Pi Dashboard</p>
            </div>

            <div class="clock" id="clock">09:41</div>
        </header>

        <section class="grid">

            <article class="card weather">
                <h2>Weather</h2>
                <div class="weather-icon">☀️</div>
                <div class="temperature">18°C</div>
                <p>Sunny · Sheffield</p>
                <p>Feels like 17°C</p>
            </article>

            <article class="card calendar">
                <h2>Upcoming events</h2>
                <div class="event">
                    <span>10:00</span>
                    <strong>Morning meeting</strong>
                </div>
                <div class="event">
                    <span>13:30</span>
                    <strong>Lunch</strong>
                </div>
                <div class="event">
                    <span>16:00</span>
                    <strong>Project work</strong>
                </div>
            </article>

        </section>

        <footer>
            <span>Raspberry Pi</span>
            <span>Swipe to navigate</span>
        </footer>

    </main>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
